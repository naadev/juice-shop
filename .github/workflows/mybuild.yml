name: My Build Workflow


on: 
  workflow_dispatch:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
      - name: Build the project
        run: npm install
  testing:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
      - name: Build the project
        run: npm install
      - name: Run tests
        run: npm test